[build-system]
requires = ["setuptools>=61.0", "setuptools_scm>=8.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finos-ai-governance-mcp-server"
dynamic = ["version"]
description = "Model Context Protocol server for FINOS AI Governance Framework"
readme = "README.md"
authors = [
    {name = "FINOS", email = "info@finos.org"}
]
license = {text = "Apache-2.0"}
keywords = ["mcp", "finos", "ai-governance", "model-context-protocol", "ai-risks", "ai-mitigations"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=4.1.2,<5",
    "mcp>=2.0.0,<3",
    "httpx>=0.28.0",
    "PyYAML>=6.0.0",
    "pydantic>=2.11.0",
    # config.py builds Settings on it; it arrived through fastmcp, which may
    # drop it in any release (#321). The floor is fastmcp-slim's own.
    "pydantic-settings>=2.0.0",
    "tenacity>=9.2.1",
    # Loads the static public key at startup (#287); fastmcp needs it anyway.
    "cryptography>=42.0.0",
    # http_health.py builds the health responses on it; it arrived through
    # mcp (#321). The floor is mcp's own.
    "starlette>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "types-PyYAML>=6.0.0",
    "pre-commit>=3.0.0",
    # Runs the detect-secrets pre-commit hook and backs the control test in
    # tests/unit/test_secrets_scanning.py. Declared here rather than pinned in
    # .pre-commit-config.yaml so there is one version, like every other tool.
    "detect-secrets>=1.5.0",
    # Runs the check-dependabot, check-issue-forms and check-issue-config
    # pre-commit hooks against the schemas it vendors, so the checks need no
    # network. .github/dependabot.yml failed its schema in eight places, and
    # Dependabot never opened a pull request (#76).
    "check-jsonschema>=0.33.0",
    # tests/unit/test_calm_architecture.py checks each CALM control
    # configuration against its requirement schema in calm/controls/.
    # check-jsonschema already brings it in; declared so the test does not
    # depend on a transitive package.
    "jsonschema>=4.18.0",
]
security = [
    "bandit>=1.7.0",
    # 3.3 is the floor that reads [tool.pylint.*] out of pyproject.toml with the
    # stdlib TOML parser. The pre-commit hook used to pin its own copy at v3.3.8
    # in an isolated environment; it now runs this one, so there is one pylint.
    "pylint>=3.3.0",
    # Pinned here rather than installed ad hoc at each call site, so the audit
    # tool version is resolved the same way as everything else it audits.
    "pip-audit>=2.9.0",
]
test = [
    "pytest>=8.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    # httpx has no "test" extra; the one named here did nothing (#321).
    "httpx>=0.28.0",
]

[project.scripts]
finos-mcp = "finos_mcp.fastmcp_main:main"

[project.urls]
# The FINOS repository the package is built and published from. These four
# values are the wheel's Project-URL metadata, which is what PyPI renders, so
# they are pinned by tests/unit/test_ci_config_drift.py rather than left to
# drift (#78).
Homepage = "https://github.com/finos/aigf-mcp-server"
Repository = "https://github.com/finos/aigf-mcp-server"
Documentation = "https://github.com/finos/aigf-mcp-server/blob/main/README.md"
"Bug Tracker" = "https://github.com/finos/aigf-mcp-server/issues"

[tool.setuptools]
package-dir = {"" = "src"}
# Include the content license that LICENSE and NOTICE direct package users to.
license-files = ["LICENSE", "LICENSE.spdx", "NOTICE", "FINOS-LICENSE.md"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.md", "*.txt", "*.yml", "*.yaml"]

# Development tool configurations

# Black removed - using Ruff format instead for unified toolchain

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = [
    "*/_version.py",  # Auto-generated by setuptools-scm
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "S",   # flake8-bandit (security) - basic security checks
    "RUF", # ruff-specific rules
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "S101",  # assert usage (acceptable in tests and development)
    "S301",  # pickle security (acceptable for internal cache with nosec comment)
]

[tool.ruff.lint.per-file-ignores]
# Internal development tools - allow subprocess calls and other dev patterns
"src/finos_mcp/internal/*" = ["S603", "S607", "S110", "S324", "E721"]
# Test files - allow various test patterns
# B017 (assert-raises-broad-exception) is deliberately NOT ignored: a
# `pytest.raises(Exception)` is satisfied by any failure, including the test
# harness breaking, so it asserts nothing.
"tests/*" = ["S106", "S101", "E712", "RUF059", "F841", "S105", "S603", "S607"]
"scripts/*" = ["UP006", "UP035"] # scripts can use older typing for compatibility

[tool.ruff.format]
# Use default settings, which are Black-compatible
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
# Single source of truth for type-checking rules. Call sites must not pass
# semantic flags (--strict-optional, --disallow-*, --warn-*, --config-file);
# they may pass only presentational ones. tests/unit/test_ci_config_drift.py
# enforces that, and also asserts that this is the file mypy actually resolves.
#
# A .mypy.ini used to sit beside this block. mypy resolves it first, so for the
# life of the repo these settings were dead text while the effective config had
# no_strict_optional = True and not one disallow_* rule -- `mypy src/finos_mcp`
# printed Success without ever checking the body of an untyped function. Do not
# reintroduce mypy.ini, .mypy.ini, or a [mypy] section in setup.cfg.
python_version = "3.11"
# Implies disallow_untyped_defs, disallow_incomplete_defs, check_untyped_defs,
# disallow_untyped_decorators, disallow_untyped_calls, disallow_any_generics,
# disallow_subclassing_any, warn_return_any, warn_redundant_casts,
# warn_unused_ignores, no_implicit_reexport, strict_equality and extra_checks.
# Listing any of them again here, or at a call site, only invites drift.
strict = true
warn_unused_configs = true
# What mypy checks, declared once like the rules: call sites run a bare `mypy`.
# Until #343 every call site named src/finos_mcp, so no test was ever checked.
# The test directories have no __init__.py; explicit_package_bases names their
# modules from the repo root (tests.unit.test_x), which the tests.* override
# below relies on, and mypy_path finds finos_mcp in src/ rather than as an
# installed package without a py.typed marker.
files = ["src/finos_mcp", "tests"]
explicit_package_bases = true
mypy_path = "src"
# Strict optional is on -- mypy's default, and what `strict = true` intends.
# The deleted .mypy.ini disabled it, while every CI call site re-enabled it with
# --strict-optional; a bare local `mypy` was the one run that did not. One
# declared value, honoured everywhere, replaces both halves of that.
show_error_codes = true
# Development tooling only; every test, the live functional-gate suite
# included, is checked (#346).
exclude = ["scripts/"]

# Third-party packages that ship no type information. Narrow on purpose: the
# deleted .mypy.ini set ignore_missing_imports globally, which would also have
# hidden a genuinely missing first-party import.
[[tool.mypy.overrides]]
module = ["jsonschema.*", "mcp.*", "yaml.*"]
ignore_missing_imports = true

# Tests may leave signatures unannotated: a test function's parameters are
# fixtures and its return is None. check_untyped_defs stays on through strict,
# so every test body is still type-checked.
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false

[tool.bandit]
# Use the external ruleset. Every call site also passes -c explicitly, so this
# only affects a bare `bandit -r src/`; it pointed at a file that never existed.
configfile = "config/security/bandit.yml"

# Single source of truth for pylint, for the same reason [tool.mypy] above is one
# for mypy. A `.pylintrc` used to sit beside this block, and pylint resolves that
# filename *before* pyproject.toml, so a [tool.pylint] table added while it still
# existed would have been dead text. Do not reintroduce pylintrc, .pylintrc, or a
# [pylint] section in tox.ini/setup.cfg; tests/unit/test_ci_config_drift.py reads
# the configuration pylint actually resolves and fails if one reappears.
#
# The deleted file was 650 lines, but it was a `pylint --generate-rcfile` dump:
# comparing pylint's own resolved configuration namespace against its defaults
# showed it changed exactly three settings, which are the three below. Its
# `disable=` list was byte-identical to pylint's default list, and its
# `generated-members=` was an empty INI value resolving to "" where the default
# is [] -- both empty, so it is not carried over.
#
# It also carried `suggestion-mode`, removed in pylint 4, so every run emitted
# `E0015: Unrecognized option found`. That error landed in the JSON report CI
# parses while pylint still exited 0, because a score above fail-under clears
# the failure bits. Dropping the dead option removes the error rather than
# suppressing it.
[tool.pylint.main]
# The score gate, declared once. Call sites must not pass --fail-under: three of
# them did, all at 8.0, so the release gate ran the weakest threshold in the
# repo. tests/unit/test_ci_config_drift.py enforces this.
fail-under = 8.5

# The oldest interpreter pylint should assume when deciding what is available.
py-version = "3.11"

# _version.py is generated by setuptools-scm at build time and is not source.
#
# The character class is load-bearing, not a style choice. pylint expands each
# entry into a two-alternative regex via
#   str(PureWindowsPath(p)).replace("\\", "\\\\") + "|" + PureWindowsPath(p).as_posix()
# so *both* alternatives are parsed as Windows paths and a backslash in the
# pattern is consumed as a path separator. The deleted .pylintrc wrote
# `_version\.py`, which expanded to `src\\finos_mcp\\_version\\.py|
# src/finos_mcp/_version/.py`: the first alternative only matches Windows-style
# paths, and in the second the `\.` has become `/.`, so on Linux and macOS it
# never matched and _version.py was linted anyway (it was reporting C0114).
# `[.]` carries no backslash, survives the expansion, and matches on both.
#
# For the same reason, never paste `pylint --generate-toml-config` output back
# in here: it echoes the *already expanded* pattern, which would be expanded a
# second time.
ignore-paths = ["src/finos_mcp/_version[.]py"]

[tool.pytest.ini_options]
# 8.4 introduced pytest.RaisesGroup, used by tests/integration to assert on the
# HTTP status inside the anyio ExceptionGroup rather than on "some exception".
minversion = "8.4"
addopts = [
    "--strict-markers",
    "--strict-config",
    "--disable-warnings",
    "-ra",
]
testpaths = ["tests"]
# The repository root, so tests import shared helpers as tests.helpers (#381).
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
# Stated, not left to the plugin's default: pytest-asyncio 1.4.1 warns when it
# is unset, and the filter below turns that warning into an INTERNALERROR that
# stops every run (#392). No async fixture in tests/ has a wider scope.
asyncio_default_fixture_loop_scope = "function"
# --disable-warnings hides every warning, so a deprecation fails the run instead
# of waiting unseen for the release that removes the name (#340).
filterwarnings = ["error::DeprecationWarning"]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "mcp: MCP protocol tests",
    "console: Console script tests",
    "slow: Slow running tests",
    "asyncio: Async tests",
    "performance: Performance tests",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*",
]

[tool.coverage.report]
# Single source of truth for the coverage gate. Call sites must not pass
# --cov-fail-under; tests/unit/test_ci_config_drift.py enforces that.
fail_under = 82
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
]

# Security scanning tool configurations - see config/security/bandit.yml and
# config/security/semgrep.yml for detailed configs

[tool.finos.pip-audit]
# Single source of truth for the dependency-audit suppression list. Call sites
# must not pass --ignore-vuln; they run scripts/pip-audit-scan.sh, which reads
# this table. tests/unit/test_ci_config_drift.py enforces both rules.
#
# Every entry needs an advisory id, a written rationale, and a review_by date.
# A suppression past its review_by date fails the build:
#
#   ignore = [
#     { id = "GHSA-xxxx-xxxx-xxxx", reason = "no upstream fix; not reachable
#       because ...", review_by = "2026-12-01" },
#   ]
#
# Empty is the correct current state. The two entries that used to live inline
# at the call sites were both retired on 2026-08-16 after being measured:
#   - GHSA-7gcm-g887-7qv7 (protobuf): fixed upstream in protobuf 6.33.5, and
#     protobuf is not in the audited environment anyway -- its only route in
#     was semgrep, which runs in a separate venv (scripts/semgrep-isolated.sh).
#   - PYSEC-2022-42969 (py): the `py` package is not in the dependency tree at
#     all, so the suppression matched nothing.
ignore = []

[tool.setuptools_scm]
write_to = "src/finos_mcp/_version.py"
version_scheme = "guess-next-dev"
local_scheme = "dirty-tag"
