# Bandit configuration for FINOS AI Governance MCP Server
# Security linting configuration for Python code
#
# NOTE: bandit's YAML config only honours a small set of keys (`skips`,
# `tests`, `exclude_dirs`, `include`, and per-plugin option blocks). Any other
# key is silently ignored. Do not add keys such as `severity`, `confidence`,
# `output_format` or `plugins` here expecting them to take effect -- they will
# read as configuration while doing nothing. Severity and confidence
# thresholds, the output format and the report path are all passed on the
# command line by .github/workflows and scripts/ci-local.sh.
#
# In particular, do NOT set `include` to a directory. It is a list of filename
# globs (default: '*.py', '*.pyw'), not paths. Setting it to 'src' matched no
# files at all and made this scan silently cover zero lines of code. Scan
# targets are passed on the command line instead (`bandit -r src/`).

# Tests to skip
skips:
  - B101 # assert_used - asserts are expected in test files

# Directories never worth scanning
exclude_dirs:
  - 'tests'
  - '.venv'
  - 'venv'
  - '__pycache__'
  - '.git'
  - 'dist'
  - 'build'
  - '.pytest_cache'
