version: 2

# Dependabot opens its pull requests against `main`, the only branch pull
# requests here target, so security-analysis.yml and
# dependabot-security-validation.yml both run on them. Titles are written to
# pass conventional-commits.yml: `chore(deps): bump ...`, `ci(deps): bump ...`.
#
# This file used to fail GitHub's schema in eight places and target three
# branches that never existed, so Dependabot never opened a pull request (#76).
# The `check-dependabot` pre-commit hook validates it against that schema, and
# tests/unit/test_workflow_triggers.py checks the routing and the titles.

updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5
    groups:
      # Security updates arrive as one pull request. They need Dependabot
      # security updates enabled in the repository settings; this file alone
      # does not switch them on.
      python-security:
        applies-to: security-updates
        patterns:
          - "*"
      python-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    # A major version of the protocol, HTTP, validation or YAML libraries is
    # a deliberate upgrade, not a weekly bump.
    ignore:
      - dependency-name: "mcp"
        update-types: ["version-update:semver-major"]
      - dependency-name: "httpx"
        update-types: ["version-update:semver-major"]
      - dependency-name: "pydantic"
        update-types: ["version-update:semver-major"]
      - dependency-name: "PyYAML"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "06:00"
      timezone: "UTC"
    commit-message:
      prefix: "ci(deps)"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
    # No ignore: GitHub retires the Node runtime an action major declares on its
    # own schedule, so a held-back major outlives it (#165). The pull request
    # is the deliberate review; tests/unit/test_workflow_triggers.py refuses
    # an ignore, an allow, an exclude-paths or a zero pull-request limit here,
    # and requires the directory to stay "/".
