name: Validate Static Fallback Sync

on:
  # Run weekly on Mondays at 9 AM UTC to detect upstream repository changes
  schedule:
    - cron: '0 9 * * 1'
  # Run on a push to main that changes the generated catalog module
  push:
    branches: [ main ]
    paths:
      - 'src/finos_mcp/content/static_catalog.py'
  # Allow manual trigger
  workflow_dispatch:

permissions:
  contents: read
  issues: write  # To create issues if out of sync

jobs:
  validate-sync:
    name: Validate Static Fallback Lists
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          # Every gate resolves its interpreter through scripts/project-python.sh,
          # which is virtualenv-based and will not fall back to a bare system
          # interpreter -- that fallback is what let a stale environment become the
          # audited artefact for six months (#89). Creating the virtualenv here is
          # what makes a runner resolve the same way a laptop does; without it the
          # shim has nothing to find. $GITHUB_PATH persists across steps, so later
          # steps need no `source`, but this step still does.
          python -m venv venv
          echo "$PWD/venv/bin" >> "$GITHUB_PATH"
          # shellcheck source=/dev/null
          source venv/bin/activate
          python -m pip install --upgrade pip
          pip install -e .[dev,test]

      - name: Run static fallback validation test
        id: validation
        continue-on-error: true
        env:
          # The unauthenticated limit is shared across hosted runners; without
          # a token the test skipped, two skips exit 0, and the step reported
          # "synchronized" having compared nothing (#297). Under the second
          # variable the test fails instead of skipping.
          FINOS_MCP_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FINOS_STATIC_SYNC_NO_SKIP: '1'
        run: |
          python -m pytest tests/integration/test_static_fallback_sync.py -v --tb=short

      - name: Check validation result
        if: steps.validation.outcome == 'failure'
        run: |
          # No repair steps here: the guide holds them, and a copy kept in this
          # file went on giving steps that did not work (#246).
          echo "❌ Static fallback lists are out of sync with GitHub repository!"
          echo ""
          echo "The repair steps are in docs/static-fallback-maintenance.md"
          exit 1

      - name: Report success
        if: steps.validation.outcome == 'success'
        run: |
          echo "✓ Static fallback lists are synchronized with GitHub repository"

      - name: Create issue if out of sync (scheduled runs only)
        if: steps.validation.outcome == 'failure' && github.event_name == 'schedule'
        uses: actions/github-script@v9
        with:
          script: |
            const title = '🔄 Static fallback lists out of sync with GitHub repository';
            // No repair steps here: the guide holds them, and a copy kept in
            // this file went on giving steps that did not work (#246).
            const body = `## Problem

            The static catalog in \`src/finos_mcp/content/static_catalog.py\` no longer matches the FINOS AI Governance Framework repository: \`tests/integration/test_static_fallback_sync.py\` failed in the run below.

            ## Solution

            Follow [the maintenance guide](${{ github.server_url }}/${{ github.repository }}/blob/main/docs/static-fallback-maintenance.md). It describes the symptoms and holds the repair steps; this issue repeats none of them.

            ## Validation

            This issue was automatically created by the weekly validation workflow.
            Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            `;

            // Check if issue already exists
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'static-fallback-sync',
            });

            if (issues.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['bug', 'static-fallback-sync', 'automated'],
              });
              console.log('✓ Created issue for static fallback sync');
            } else {
              console.log('ℹ Issue already exists, skipping creation');
            }
