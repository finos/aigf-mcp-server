name: Question
description: Ask a question about the project
title: "[Question]: "
labels: ["question"]
body:
  - type: textarea
    id: question
    attributes:
      label: What would you like to know?
      description: A clear and concise description of your question.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Context
      description: Any relevant context about what you are trying to accomplish.

  - type: textarea
    id: environment
    attributes:
      label: Environment (if relevant)
      description: Operating system, Python version and package version.
      placeholder: |
        OS: macOS, Linux, Windows
        Python version: 3.11
        Package version: 1.2.3, or a commit

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any other context about your question here.

  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      description: By submitting this issue, you agree to follow the [Code of Conduct](https://community.finos.org/docs/governance/code-of-conduct)
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true
